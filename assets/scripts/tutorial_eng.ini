[GameTutorialBase0]
SaveGame=tut0
WindowCnt=28
WindowText0=\\f1_Willkommen bei Patrizier 2, der Handelssimulation über den Seehandel während der Hansezeit.\nIn dieser Einführung werdet Ihr lernen, worauf es ankommt, um vom einfachen Krämer zum erfahrenen Fernkaufmann aufzusteigen.\nMit den beiden Buttons rechts von diesem Text könnt Ihr zwischen den einzelnen Schritten dieses Tutorials vor und zurück schalten.
WindowCode0=
WindowMp3_0=musik\tutorial\1_1.mp3
WindowText1=\\f1_Das Tutorial ist in mehrere Teile aufgegliedert. In diesem Teil lernt Ihr die Bedienung der Spieloberfläche kennen.\n\n\\f0_Hinweis\n\\f1_Für das Tutorial sollte eine Bildschirmauflösung von mindestens 1024x768 gewählt werden. 
WindowCode1=
WindowMp3_1=musik\tutorial\1_2.mp3
WindowText2=\\f1_Kommen wir zunächst zu der Aufteilung der Spieloberfläche, die aus 5 Teilen besteht.\n\\f0_Hauptansicht\n\\f1_In ihr werden die Städte und die Seekarte angezeigt. Zu Beginn eines Spiel befindet Ihr Euch immer in Eurer Heimatstadt, die im Falle dieses Tutorials Lübeck ist.
WindowCode2=Rect 284,42,2000,2000
WindowMp3_2=musik\tutorial\1_3.mp3
WindowText3=\\f1_Die Hauptansicht zeigt nur einen Ausschnitt der Stadt an. Bewegt den Mauszeiger zum Bildschirmrand oder verwendet die Pfeiltasten auf der Tastatur, um den Ausschnitt zu verschieben.
WindowCode3=Rect 284,42,2000,2000
WindowMp3_3=musik\tutorial\1_4.mp3
WindowText4=\\f0_Minikarte\n\\f1_Sie zeigt die gesamte Stadtregion an. Das Rechteck symbolisiert den angezeigten Ausschnitt. Wenn Ihr den Bildausschnitt verschiebt, so bewegt sich auch das Rechteck.
WindowCode4=Rect 5,49,250,213
WindowMp3_4=musik\tutorial\1_5.mp3
WindowText5=\\f0_Titelleiste\n\\f1_Die Titelleiste befindet sich am oberen Bildschirmrand. Befindet Ihr Euch in einer Stadt, so zeigt sie von links nach rechts folgendes an: die Einwohnerzahl, den Stadtnamen, die Anzahl Eurer Gebäude in der Stadt, Eurer Bargeld und das Datum.\nHinter den kleinen Symbolen in der Titelleiste verstecken sich auch Buttons.
WindowCode5=Rect 1,0,2000,31
WindowMp3_5=musik\tutorial\1_6.mp3
WindowText6=\\f0_Einwohnerbutton\n\\f1_Klickt auf das Einwohnersymbol, um die Bevölkerungsverteilung und die Zufriedenheit der Bürger in dieser Stadt einzusehen. Sind Pfeile hinter der Zufriedenheit sichtbar, so zeigen diese an, ob die Bürger zufriedener oder unzufriedener werden. 
WindowCode6=Rect 1,0,2000,31
WindowMp3_6=musik\tutorial\1_7.mp3
WindowText7=\\f0_Gebäudebutton\n\\f1_Das Gebäudesymbol verändert die Gebäudeansicht. Mit Hilfe dieses Buttons könnt Ihr eigene von fremden Gebäuden besser unterscheiden.
WindowCode7=Rect 1,0,2000,31
WindowMp3_7=musik\tutorial\1_8.mp3
WindowText8=\\f0_Geldbutton\n\\f1_Wenn Ihr auf das Bargeldsymbol klickt, so öffnet sich das Fenster mit dem Statistikmenü. Dieses Menü wird allerdings nicht innerhalb dieses Tutorials erklärt. Um ein Fenster zu schließen, klickt entweder auf den Schließen-Button in der unteren rechten Ecke des Fensters, oder macht einen Rechtsklick.
WindowCode8=Rect 1,0,2000,31
WindowMp3_8=musik\tutorial\1_9.mp3
WindowText9=\\f0_Chronik\n\\f1_Schließlich verbirgt sich hinter der Sanduhr die Chronik. In der Chronik werden wichtige öffentliche Nachrichten festgehalten. Es lohnt sich, immer wieder hier herein zu schauen, um über Ereignisse in der Hanse informiert zu werden. Schließt die Chronik entweder über den "Schließen"-Button oder mit einem Rechtsklick.
WindowCode9=Rect 1,0,2000,31
WindowMp3_9=musik\tutorial\1_10.mp3
WindowText10=\\f0_Selektionsfenster oder Auswahlfenster\n\\f1_Hier werden Informationen über von Euch ausgewählte Schiffe angezeigt. Dies wollen wir nun einmal testen.\nBewegt den Bildausschnitt zum Hafen der Stadt. Im Hafen seht Ihr ein Schiff, das den Namen "Adler der See" trägt. Dies ist Euer Schiff. Klickt es an, um es zu selektieren.
WindowCode10=Rect 1,341,260,256
WindowMp3_10=musik\tutorial\1_11.mp3
WindowText11=\\f1_Im Selektionsfenster werden nun Informationen über das selektierte Schiff angezeigt. Unter dem Schiffsnamen seht Ihr, wo sich das Schiff befindet. Wenn es an einen anderen Ort geschickt wird, so steht hier auch das Reiseziel. Daneben steht auch die Beladung des Schiffs. Die oberste Zahl zeigt die Kapazität an, darunter steht, wieviel Platz durch Waren verbraucht wird. Die unterste Zahl zeigt schließlich an, wieviel durch Besatzung und Bewaffnung benötigt wird.
WindowCode11=Rect 1,341,260,256
WindowMp3_11=musik\tutorial\1_12.mp3
WindowText12=\\f1_Außerdem wird die Geschwindigkeit in Knoten, der Schiffszustand von 0 bis 100% und die Besatzung angezeigt.\nDaneben seht Ihr die Bewaffnungstärke des Schiffs. 
WindowCode12=Rect 92,394,166,40
WindowMp3_12=musik\tutorial\1_13.mp3
WindowText13=\\f1_Darunter seht Ihr die Liste aller Waren, die sich an Bord befinden. Beachtet, daß es zwei Maßeinheiten gibt. Eine Last entspricht genau 10 Faß.
WindowCode13=Rect 1,432,260,165
WindowMp3_13=musik\tutorial\1_14.mp3
WindowText14=\\f0_Buttonleiste\n\\f1_Betrachten wir nun die Buttonleiste und gehen die Buttons von links nach rechts durch.\nDer erste Button zeigt die Schiffsliste an. Klickt ihn bitte an.
WindowCode14=Rect 1,268,259,30
WindowMp3_14=musik\tutorial\1_15.mp3
WindowText15=\\f1_Ihr könnt nun sehen, welche Schiffe in Eurem Besitz sind, wie sie heißen und wo sie sich gerade befinden. In diesem Tutorial habt Ihr nur ein Schiff, daher zeigt die Schiffsliste auch nur ein Schiff an.\nDie Schiffsliste zeigt Name, Schiffstyp, Status und Ort, Beladung und Wert der geladenen Waren an. Mittels des Buttons unter der Liste könnt Ihr auf die Anzeige der Besatzung und Bewaffnung umschalten.
WindowCode15=
WindowMp3_15=musik\tutorial\1_16.mp3
WindowText16=\\f1_Übrigens gibt es links von jedem Schiff in der Schiffsliste den "Gehe-Zu"-Button. Wenn Ihr auf diesen Button klickt, springt Ihr zu der Stelle, an der sich das Schiff aufhält. Dies kann auch in einer anderen Stadt oder auf See sein. Versucht dies ruhig einmal, um das Schiff "Adler der See" in den Sichtbereich zu holen.\nSchließt dann die Schiffsliste.
WindowCode16=
WindowMp3_16=musik\tutorial\1_17.mp3
WindowText17=\\f1_Der nächste Button ist der Schnellvorlauf. Wenn Ihr ihn drückt, wird die Zeit beschleunigt ablaufen. Währenddessen wird eine Karte angezeigt, auf der Ihr alle Eure Schiffe verfolgen könnt. Der Schnellvorlauf wird abgeschaltet, sobald Ihr einen Mausbutton drückt oder sobald eines Eurer Schiffe im Hafen anlegt.
WindowCode17=Rect 1,268,259,30
WindowMp3_17=musik\tutorial\1_18.mp3
WindowText18=\\f1_Hinter dem nächsten Button verbirgt sich das Nachrichten-Menü. Hier werden alle Briefe abgelegt, die Ihr erhaltet. Klickt auf diesen Button und Ihr seht das Nachrichten-Menü mit den verschiedenen Rubriken, in denen die Nachrichten abgelegt werden. Klickt eine Rubrik an und dann auf eine Nachricht, um sie zu lesen.\nSchließt die Nachricht wie jedes Fenster mit dem Schließen-Button oder einem Rechtsklick.
WindowCode18=Rect 1,268,259,30
WindowMp3_18=musik\tutorial\1_19.mp3
WindowText19=\\f1_Mit Hilfe des vorletzten Buttons im Nachrichten-Menü könnt Ihr die Briefablage konfigurieren, um Briefe nach einiger Zeit automatisch zu löschen. Ihr könnt einen Brief auch löschen, indem Ihr ihn anwählt und dann auf den "Löschen"-Button rechts im Nachrichten-Menü klickt.
WindowCode19=Rect 1,302,260,31
WindowMp3_19=musik\tutorial\1_20.mp3
WindowText20=\\f1_Der nächste Button in der Buttonleiste ist das Baumenü. Mit Hilfe dieses Menüs könnt Ihr Gebäude in Städten bauen, in denen Ihr ein Kontor besitzt. Das Kontor ist Wohnraum, Arbeitsraum und zugleich das Lager eines Händlers.\nKontor und Baumenü werden im übernächsten Kapitel erklärt.
WindowCode20=Rect 1,268,259,30
WindowMp3_20=musik\tutorial\1_21.mp3
WindowText21=\\f1_Wenn Ihr auf den Stadttor-Button klickt, verlaßt Ihr die Stadt und kommt auf die Seekarte.\nAnstelle der Stadt wird dann die Seekarte angezeigt. Den Ausschnitt könnt Ihr wie gewohnt mit den Pfeiltasten auf der Tastatur verschieben.
WindowCode21=Rect 1,268,259,30
WindowMp3_21=musik\tutorial\1_22.mp3
WindowText22=\\f1_Auf der Seekarte werden alle Städte und Eure Schiffe angezeigt. Auch See-Ereignisse oder fremde Schiffe werden hier sichtbar.\nIhr könnt von dieser Karte aus alle Städte betreten, in denen Ihr Schiffe oder Gebäude habt. In diesem Tutorial seid Ihr nur in Lübeck vertreten.
WindowCode22=
WindowMp3_22=musik\tutorial\1_23.mp3
WindowText23=\\f1_Übrigens hat sich auch die Titelleiste verändert. Da Ihr Euch in keiner Stadt mehr befindet, werden vier Schiffsbuttons angezeigt. Mit Hilfe dieser Buttons könnt Ihr durch Eure Schiffe schalten. Dabei wird zwischen angelegten und reisenden Schiffen und Konvois unterschieden.
WindowCode23=Rect 249,0,2000,31
WindowMp3_23=musik\tutorial\1_24.mp3
WindowText24=\\f1_Außerdem wird angezeigt, wie viele Schiffe beispielsweise in einem Hafen liegen und auf neue Befehle warten.\nSchiffe, die sich zur Reparatur oder zum Ausbau in der Werft befinden, werden nicht mit aufgeführt, da sie keine Befehle entgegen nehmen können.
WindowCode24=Rect 249,0,2000,31
WindowMp3_24=musik\tutorial\1_25.mp3
WindowText25=\\f1_Um die Seekarte wieder zu verlassen und um zurück nach Lübeck zu kommen, klickt auf den blauen Knopf bei Lübeck auf der Seekarte. Der letzte Button ganz rechts in der Button-Leiste bringt Euch zum Optionen-Menü. Hier könnt Ihr auch Spielstände laden und speichern sowie das Spiel beenden.
WindowCode25=Rect 1,268,259,30
WindowMp3_25=musik\tutorial\1_26.mp3
WindowText26=\\f1_Noch ein Hinweis zur Bedienung mit den Maustasten:\nMit einem Linksklick könnt Ihr Objekte wie Schiffe und Gebäude anwählen. Mit einem Rechtsklick könnt Ihr ein ausgewähltes Schiff an einen anderen Ort schicken. Außerdem dient der Rechtsklick dazu, ein Fenster in der Hauptansicht zu schließen.
WindowCode26=
WindowMp3_26=musik\tutorial\1_26_1.mp3
WindowText27=\\f1_Und damit ist das Tutorial 1 abgeschlossen. Klickt auf den "Weiter"-Button, um dieses Kapitel zu beenden und um das nächste Kapitel zu beginnen. Oder wählt "Spiel beenden" im Optionen-Menü, um zurück zum Hauptmenü zu gelangen.
WindowCode27=
WindowMp3_27=musik\tutorial\1_27.mp3

[GameTutorialBase1]
SaveGame=tut1
WindowCnt=43
WindowText0=\\f1_Willkommen beim zweiten Kapitel des Tutorials. In diesem Teil wollen wir uns näher mit den Schiffen beschäftigen. Dazu gehört beispielsweise das Reisen und das Anheuern von Kapitänen und Matrosen.\nKlickt nun auf den "Weiter"-Button, um zum nächsten Schritt zu gelangen.
WindowCode0=
WindowMp3_0=musik\tutorial\2_1.mp3
WindowText1=\\f1_Ihr befindet Euch in der Stadt Lübeck. Bewegt den Bildschirmausschnitt nun zum Hafen und selektiert das Schiff "Adler der See", indem Ihr einen Linksklick darauf macht. Das Schiff erscheint daraufhin im Selektionsfenster unten rechts. \nBetrachten wir dieses Fenster nun genauer.
WindowCode1=Rect 1,341,260,256
WindowMp3_1=musik\tutorial\2_2.mp3
WindowText2=\\f1_Unter dem Namen des Schiffes seht Ihr einen Anker und den Stadtnamen "Lübeck". Anhand des Ankers und des Ortes erkennt man, daß das Schiff im Hafen von Lübeck vor Anker liegt. Anstatt des Ankers kann hier auch ein anderes Symbol stehen, beispielsweise wenn das Schiff unterwegs ist. Dazu kommen wir noch. 
WindowCode2=Rect 1,341,260,91
WindowMp3_2=musik\tutorial\2_3.mp3
WindowText3=\\f1_In der Zeile darunter wird zunächst die Geschwindigkeit des Schiffes in Knoten angezeigt. Im Hafen steht hier natürlich 0. Daneben seht Ihr den Schiffszustand, der momentan 100% beträgt, das Schiff ist also in einwandfreiem Zustand.
WindowCode3=Rect 92,394,166,40
WindowMp3_3=musik\tutorial\2_4.mp3
WindowText4=\\f1_Dann kommen Besatzung und Bewaffnung. Die Zahl gibt die Anzahl der Matrosen an Bord an. Der Stern bedeutet, daß auch ein Kapitän an Bord ist.\nUnter dem Waffensymbol werden kleine und große Kugeln angezeigt. Maximal können hier 5 große Kugeln angezeigt werden, wobei 5 kleine Kugeln gerade einer großen entsprechen.
WindowCode4=Rect 92,394,166,40
WindowMp3_4=musik\tutorial\2_5.mp3
WindowText5=\\f1_Das große Faß zeigt die Beladung des Schiffs an. Wie bereits erwähnt, zeigt die oberste Zahl rechts vom Faß die Ladekapazität an, darunter steht, wieviel Platz durch Waren verbraucht wird. Die unterste Zahl zeigt schließlich an, wieviel durch Besatzung und Bewaffnung benötigt wird. Da noch keine Waren an Bord sind, ist die mittlere Zahl 0.
WindowCode5=Rect 1,341,260,91
WindowMp3_5=musik\tutorial\2_6.mp3
WindowText6=\\f1_In der freien Fläche unter diesen ganzen Angaben wird später die Warenliste angezeigt.
WindowCode6=Rect 1,432,260,165
WindowMp3_6=musik\tutorial\2_7.mp3
WindowText7=\\f1_Kommen wir nun zu den anderen Buttons im Schiffsmenü. Zunächst haben wir hier noch die Besatzungsinfo. Klickt auf den Button "Besatzung". Hier seht Ihr noch mal die Zahl der Matrosen und die Höhe der täglichen Heuer. Da das Schiff im Hafen liegt, könntet Ihr auch Matrosen und Kapitän entlassen. Das solltet Ihr nun aber nicht tun.
WindowCode7=Rect 1,302,260,31
WindowMp3_7=musik\tutorial\2_8.mp3
WindowText8=\\f1_Unter dem Kapitän seht Ihr auch 3 Werte: Handelsbonus, Reisebonus und Seeschlachtbonus. Diese Boni bringt der Kapitän mit. Je älter ein Kapitän ist, desto besser ist seine Erfahrung.\nDie anderen Buttons des Schiffmenüs sind in den ersten Spielstunden eher uninteressant. Sie werden im Handbuch erklärt. 
WindowCode8=
WindowMp3_8=musik\tutorial\2_9.mp3
WindowText9=\\f1_Wir wollen nun mal das Schiff zu einer anderen Stadt schicken. Dazu muß das Schiff selektiert sein. Klickt nun auf den Button "Stadt verlassen" in der Buttonleiste über dem Schiffsmenü.\nDann wird die große Seekarte angezeigt.
WindowCode9=Rect 1,268,259,30
WindowMp3_9=musik\tutorial\2_10.mp3
WindowText10=\\f1_Wie Ihr bemerkt, ist das Schiff immer noch selektiert und die Stadt, in der sich das Schiff befindet, wird zentriert. Da das Schiff im Hafen liegt, könnt Ihr es auf dieser Karte nicht direkt sehen. Allerdings seht Ihr neben der Stadt Lübeck ein kleines Banner mit einem Schiff und einer Zahl. Dies sind Eure Schiffe in der Stadt.
WindowCode10=
WindowMp3_10=musik\tutorial\2_11.mp3
WindowText11=\\f1_Klickt nun mal auf dieses Banner, um die Schiffe genauer anzuzeigen. Wie Ihr seht, öffnet sich die bekannte Schiffsliste. Sie zeigt alle Schiffe an, die in der Stadt vor Anker liegen. Klickt nun das Schiff "Meermaid" in der Liste an. Ihr seht, wie es im Selektionsfenster angezeigt wird. 
WindowCode11=
WindowMp3_11=musik\tutorial\2_12.mp3
WindowText12=\\f1_Mit einem Klick auf den Pfeil links neben den Schiffsnamen wird das Schiff selektiert und auf dem Bildschirm zentriert. Außerdem wird die Liste geschlossen. Alternativ könnt Ihr auch einen Doppelklick auf den Schiffsnamen machen. Übt dies ein paarmal und öffnet die Liste wieder, indem Ihr auf das Banner neben der Stadt Lübeck klickt.
WindowCode12=
WindowMp3_12=musik\tutorial\2_13.mp3
WindowText13=\\f1_Selektiert nun wieder das Schiff "Adler der See" und schließt die Schiffsliste. Das Schiff muß im Selektionsfenster angezeigt werden. Nun bewegt die Seekarte mit Hilfe der Cursortasten nach rechts und nach oben, bis die Stadt Riga angezeigt wird. Nun macht einen Rechtsklick auf den roten Knopf bei Riga, um dem Schiff Riga als Ziel anzugeben.
WindowCode13=
WindowMp3_13=musik\tutorial\2_14.mp3
WindowText14=\\f1_Im Selektionsfenster seht Ihr nun, daß sich der Status des Schiffes geändert hat. Anstatt des Ankersymbols seht Ihr nun ein Schiff und die Zielstadt Riga. Auch die voraussichtliche Reisezeit in Tagen wird angezeigt.
WindowCode14=Rect 1,341,260,91
WindowMp3_14=musik\tutorial\2_15.mp3
WindowText15=\\f1_Vielleicht habt Ihr bemerkt, daß es eine Weile gedauert hat, bis das Schiff auf der Seekarte sichtbar wurde. Das liegt daran, daß das Schiff noch eine Weile im Hafenbecken der Stadt verbringt, bevor es auf die Seekarte kommt.
WindowCode15=
WindowMp3_15=musik\tutorial\2_16.mp3
WindowText16=\\f1_Sobald sich das Schiff auf der Seekarte befindet, seht Ihr es übrigens auch auf der Minikarte. Blaue Vierecke sind Eure Schiffe, selektierte Schiffe haben blinkende Vierecke. Manchmal werden auch weiße Vierecke sichtbar. Dies sind dann Schiffe Eurer Konkurrenten, die im Sichtbereich eines Eurer Schiffe liegen.
WindowCode16=Rect 5,49,250,213
WindowMp3_16=musik\tutorial\2_17.mp3
WindowText17=\\f1_Jetzt, wo das Schiff unterwegs ist, haben wir etwas Zeit, um die Seekarte genauer zu betrachten. Bewegt die Karte so, daß Lübeck wieder sichtbar wird. Während alle Städte einen roten Knopf haben, hat Lübeck einen blauen. Dies zeigt, daß Lübeck Eure Heimatstadt ist. 
WindowCode17=
WindowMp3_17=musik\tutorial\2_18.mp3
WindowText18=\\f1_Sobald Ihr in einer anderen Stadt ein Kontor errichtet, wird ein blauer Punkt auf dem roten Knopf angezeigt. Auf diese Weise könnt Ihr schnell sehen, in welchen Städten Ihr ein Kontor habt.\nGenerell gilt, daß Blau Eure Farbe ist. Sie wird Euch in allen möglichen Ansichten wieder begegnen. 
WindowCode18=
WindowMp3_18=musik\tutorial\2_19.mp3
WindowText19=\\f1_Und immer dran denken: Städte mit eigenen Schiffen vor Anker erkennt Ihr immer an dem Banner neben der Stadt. Klickt nochmal auf das Banner neben Lübeck. Da nur noch ein Schiff in der Stadt ist, wird es sofort selektiert. Es heißt Meermaid. Macht nun einen Rechtsklick auf einen beliebigen Punkt mitten auf dem Meer.
WindowCode19=
WindowMp3_19=musik\tutorial\2_20.mp3
WindowText20=\\f1_Durch den Rechtsklick habt Ihr dem Schiff eine Aktion zugewiesen, in diesem Fall die Fahrt zu einer Position auf der Seekarte. Nach einer Weile wird das Schiff auf der Seekarte sichtbar.\nKlickt einmal mit Links auf eine leere Stelle auf See. Dadurch wird die bisherige Selektion aufgehoben.
WindowCode20=
WindowMp3_20=musik\tutorial\2_21.mp3
WindowText21=\\f1_Nun wartet, bis das Schiff "Adler der See" in Riga angekommen ist. \nSobald es angekommen ist, wird das Banner neben der Stadt sichtbar. Macht dann einen Linksklick auf den roten Stadtknopf, um die Stadt zu betreten. Merkt Euch: Ihr könnt nur Städte betreten, in denen Ihr ein Kontor oder ein Schiff vor Anker habt.
WindowCode21=
WindowMp3_21=musik\tutorial\2_23.mp3
WindowText22=\\f1_Nun betrachtet die Minikarte. Sie zeigt alle Gebäude und Straßen der Stadt an, auch das Hafenbecken und Euer Schiff sind sichtbar. Links neben der Karte ist ein Button mit einem Pfeil. Klickt nun auf diesen Button.
WindowCode22=Rect 5,49,250,213
WindowMp3_22=musik\tutorial\2_24.mp3
WindowText23=\\f1_Mit diesem Button könnt Ihr zwischen der Seekarte und der Stadtkarte umschalten, aber nur, wenn Ihr Euch in einer Stadt befindet. Das Besondere daran ist, daß Ihr ein Schiff in eine andere Stadt schicken könnt, ohne die Stadt zu verlassen.
WindowCode23=Rect 5,49,250,213
WindowMp3_23=musik\tutorial\2_25.mp3
WindowText24=\\f1_Die Städte werden auf der Miniseekarte durch kleine Rauten angezeigt. Seht Ihr die Stadt ganz oben in der Karte? Das ist Bergen. Nun sucht Euer Schiff im Hafen von Riga, selektiert es und klickt mit rechts auf Bergen. Zur Bestätigung blinkt die Stadt kurz auf. Tut sie es nicht, so habt Ihr daneben geklickt. Versucht es dann erneut.
WindowCode24=Rect 5,49,250,213
WindowMp3_24=musik\tutorial\2_26.mp3
WindowText25=\\f1_Durch den Rechtsklick habt Ihr Eurem Schiff ein neues Ziel zugewiesen. Das Schiff fährt zu diesem Ziel und wartet auf weitere Anweisungen.\nDamit wir nicht zu lange darauf warten müssen, daß das Schiff sein Ziel erreicht, betrachten wir nun den Schnellvorlauf.
WindowCode25=
WindowMp3_25=musik\tutorial\2_27.mp3
WindowText26=\\f1_Klickt links in der Buttonleiste den Button "Vorlauf". Ihr seht eine Karte des gesamten Seeraumes auf einen Blick sowie alle Schiffe, die gerade unterwegs sind. Außerdem läuft die Zeit stark beschleunigt ab. Die Karte wird solange angezeigt, bis ein Schiff am Ziel angelangt oder Ihr einen Mausbutton drückt.
WindowCode26=Rect 1,268,259,30
WindowMp3_26=musik\tutorial\2_28.mp3
WindowText27=\\f1_Drückt den Button immer dann, wenn Ihr darauf wartet, daß ein Schiff anlegt. Ihr werdet später bemerken, daß es noch andere Situationen gibt, die den Schnellvorlauf automatisch beenden.\nWir warten nun, bis das Schiff "Adler der See" in Bergen angekommen ist.
WindowCode27=
WindowMp3_27=musik\tutorial\2_29.mp3
WindowText28=\\f1_Betretet nun die Stadt Bergen, indem Ihr einen Linksklick darauf macht. Ist Euer Schiff "Adler der See" noch selektiert? Falls nicht, sucht es im Hafen von Bergen und selektiert es. Wie Ihr seht, hat die Reise Spuren hinterlassen: der Zustand des Schiffes ist nicht mehr 100%. Also reparieren wir es nun.
WindowCode28=
WindowMp3_28=musik\tutorial\2_30.mp3
WindowText29=\\f1_Klickt dazu auf die Werft im Hafen der Stadt, um sie zu betreten. In der Werft könnt Ihr Schiffe reparieren, neue Schiffe in Auftrag geben, ein Schiff ausbauen und den Namen eines Schiffes ändern. Uns interessiert nur der Knopf "Schiff reparieren". Klickt auf ihn.
WindowCode29=
WindowMp3_29=musik\tutorial\2_31.mp3
WindowText30=\\f1_Mittels des Buches könnt Ihr zwischen allen angelegten Schiffen schalten, die reparaturbedürftig sind. Unter dem Buch seht Ihr die Reparaturkosten und darunter den Button, um die Reparatur in Auftrag zu geben. Klickt auf diesen Button und verlaßt danach die Werft.
WindowCode30=
WindowMp3_30=musik\tutorial\2_32.mp3
WindowText31=\\f1_Wenn Ihr das Schiff nun selektiert, könnt Ihr im Selektionsfenster anhand des Schiffsstatus sehen, wie lange die Reparatur voraussichtlich noch dauern wird. Wartet nun, bis die Reparatur beendet ist. Ihr könnt dazu auch den Schnellvorlauf-Button verwenden.
WindowCode31=Rect 1,341,260,256
WindowMp3_31=musik\tutorial\2_33.mp3
WindowText32=\\f1_Vielleicht fragt Ihr Euch schon, wo Ihr die Mannschaften für Eure Schiffe anheuern könnt. Dies geschieht in der Kneipe. Sucht im Zentrum von Bergen nach der Kneipe. Ein kleiner Tip: es stehen Weinfässer an deren Hauswand und sie befindet sich gleich neben der Werft. Macht einen Linksklick auf die Kneipe.
WindowCode32=
WindowMp3_32=musik\tutorial\2_34.mp3
WindowText33=\\f1_In der Kneipe halten sich bestimmte Personen auf, mit denen Ihr euch unterhalten könnt. Nicht alle Personen sind immer anzutreffen, doch arbeitssuchende Matrosen sind fast immer da. Klickt auf den Button Matrosen.
WindowCode33=
WindowMp3_33=musik\tutorial\2_35.mp3
WindowText34=\\f1_Stellt nun übungsweise 5 Matrosen an, indem Ihr Matrosen von der Kneipe ins Schiff transferiert und auf den Button "Matrosen anwerben" klickt.
WindowCode34=
WindowMp3_34=musik\tutorial\2_36.mp3
WindowText35=\\f1_Auf ähnliche Weise könnt Ihr auch Kapitäne (sofern anwesend) einstellen. Denkt daran, daß jedes Schiff nur einen Kapitän haben kann und das freie Kapitäne sehr begehrt und eher selten sind.
WindowCode35=
WindowMp3_35=musik\tutorial\2_37.mp3
WindowText36=\\f1_Andere Personen in der Kneipe sind beispielsweise der Informant, der Piratenkapitän und der Waffenhändler. Außerdem könnt Ihr hier noch Reisende oder besondere Personen treffen, die sich mit Euch schriftlich in Verbindung gesetzt haben.
WindowCode36=
WindowMp3_36=musik\tutorial\2_38.mp3
WindowText37=\\f1_Nun wollen wir uns noch mit dem Neubau eines Schiffes beschäftigen. Begebt Euch dazu nach Lübeck, denn es ist vorteilhaft, einen Neubau in der Werft der Heimatstadt zu beauftragen. Wechselt dazu auf die Seekarte und klickt dort auf Lübeck, um die Stadt zu betreten. Wählt dann die Werft an.
WindowCode37=
WindowMp3_37=musik\tutorial\2_38_1.mp3
WindowText38=\\f1_In der Werft wählt Ihr den Button "Bauauftrag". Mit Hilfe des Buches könnt Ihr nun ein Schiff wählen. Zu Beginn stehen drei Schiffe zur Auswahl. Bekommt die Werft regelmäßig Aufträge, so verbessert sie sich und bietet bessere Schiffe an. Sucht Euch nun ein Schiff aus und betrachtet die Angaben zum Bau.
WindowCode38=
WindowMp3_38=musik\tutorial\2_38_2.mp3
WindowText39=\\f1_Unter dem Buch rechts stehen Bauzeit, Baukosten und darunter der Rohstoffbedarf. Zum Bau eines Schiffes bedarf es vieler Rohstoffe. Diese müssen entweder in Eurem Kontor liegen oder Ihr kauft sie direkt von der Stadt, sofern sie dort vorrätig sind. Die voraussichtliche Bauzeit wird in Tagen angegeben.
WindowCode39=
WindowMp3_39=musik\tutorial\2_38_3.mp3
WindowText40=\\f1_In diesem Tutorial liegen die benötigten Rohstoffe bereits in Eurem Kontor und Ihr müßt sie nicht extra kaufen. Bestätigt nun den Bau des Schiffes. Da der Neubau eines Schiffes sehr lange dauert, wollen wir in diesem Tutorial jedoch nicht auf die Fertigstellung warten.
WindowCode40=
WindowMp3_40=musik\tutorial\2_38_4.mp3
WindowText41=\\f1_Überlegt Euch immer sehr gut, bevor Ihr ein neues Schiff in Auftrag gebt, denn ein Schiff hat hohe Anschaffungs- und Unterhaltskosten. Bedenkt auch, daß nur Schniggen und Kraier die Flußstädte Köln, Thorn und Novgorod erreichen können, da die größeren Schiffstypen nicht auf Flüssen fahren.
WindowCode41=
WindowMp3_41=musik\tutorial\2_38_5.mp3
WindowText42=\\f1_Damit ist das Kapitel "Schiffe" abgeschlossen. Ihr könnt noch etwas die Kneipe und die Werft erkunden, bevor Ihr auf den "Weiter"-Button drückt, um das nächste Tutorial zu beginnen.
WindowCode42=
WindowMp3_42=musik\tutorial\2_39.mp3

[GameTutorialBase2]
SaveGame=tut2
WindowCnt=37
WindowText0=\\f1_Willkommen beim dritten Kapitel des Tutorials, dem wichtigsten Abschnitt des Einführungskurses für Seehändler, wie Ihr einer werden wollt. Es geht um den Handel und allem, was damit zusammenhängt: praktische Hinweise und wertvolle Hintergründe.
WindowCode0=
WindowMp3_0=musik\tutorial\3_1.mp3
WindowText1=\\f1_Wir werden uns mit dem Ankauf, Verkauf und dem Transport von Waren beschäftigen. Außerdem erzähle ich Euch, wie die Preise entstehen, wie man gute Preise erkennt, welchen Bedarf die Bürger haben und welche Waren man wo am besten kauft oder verkauft.
WindowCode1=
WindowMp3_1=musik\tutorial\3_2.mp3
WindowText2=\\f1_Doch zunächst einmal einige grundlegende Worte zum Handel. \nDer Handel basiert darauf, daß die Städte unterschiedliche Waren produzieren. Andererseits haben die Bürger und Betriebe in den Städten aber einen Bedarf an allen Waren. Jede Stadt muß daher bestimmte Waren importieren, um zu florieren.
WindowCode2=
WindowMp3_2=musik\tutorial\3_2_1.mp3
WindowText3=\\f1_Als Händler seid Ihr es, der die benötigten Waren in eine Stadt liefert. Eure Konkurrenten tun desgleichen überall im Hanseraum. Mit der Versorgung einer Stadt erreicht Ihr drei Dinge:
WindowCode3=
WindowMp3_3=musik\tutorial\3_2_2.mp3
WindowText4=\\f1_Erstens erhalten Bürger und Betriebe die Waren und Rohstoffe, die benötigt werden. Dadurch erhöht sich die Zufriedenheit der Bürger, die Arbeitsplätze sind gesichert und neue Arbeitsplätze können entstehen. Ein gutes Waren- und Arbeitsangebot lockt außerdem neue Bürger in die Stadt.
WindowCode4=
WindowMp3_4=musik\tutorial\3_2_3.mp3
WindowText5=\\f1_Zweitens merken sich es die Bürger, wenn Ihr Euch um die Versorgung ihrer Stadt bemüht. Mit jedem Verkauf einer benötigten Ware steigt die Anerkennung, die man Euch entgegenbringt.
WindowCode5=
WindowMp3_5=musik\tutorial\3_2_4.mp3
WindowText6=\\f1_Schließlich ist ja auch Euer Ziel, den Rang eines Patriziers zu erreichen und vielleicht sogar zum Bürgermeister gewählt zu werden. Schafft Ihr es überdies, auch über die Grenzen Eurer Heimatstadt hinaus berühmt zu werden, so könnt Ihr sogar zum Eldermann - dem Vorsitzenden der Hanse - gewählt werden.
WindowCode6=
WindowMp3_6=musik\tutorial\3_2_5.mp3
WindowText7=\\f1_Drittens könnt Ihr durch den Handel mit den richtigen Waren satte Gewinne einstreichen. Waren, die Ihr in einer Stadt mit Überangebot einkauft, könnt Ihr in einer Stadt mit hoher Nachfrage teurer verkaufen.
WindowCode7=
WindowMp3_7=musik\tutorial\3_2_6.mp3
WindowText8=\\f1_Die Gewinne könnt Ihr dazu verwenden, Eure Unternehmung auszubauen, etwa, indem Ihr neue Schiffe baut oder selbst Waren produziert.\nDoch nun zurück zur Praxis.
WindowCode8=
WindowMp3_8=musik\tutorial\3_2_7.mp3
WindowText9=\\f1_Wir befinden uns wieder in Lübeck. Im Hafen befindet sich das Schiff "Adler der See", das Ihr nun selektieren solltet. Am Hafen seht Ihr eine Vielzahl von Hafenkränen. Macht nun einen Linksklick auf einen beliebigen Kran. Dies öffnet das Handelsfenster.
WindowCode9=
WindowMp3_9=musik\tutorial\3_3.mp3
WindowText10=\\f1_In jeder Stadt gibt es solche Hafenkräne. Mit Hilfe des Handelsfensters könnt Ihr zwischen Stadt und Schiff, zwischen Stadt und Kontor sowie zwischen Schiff und Kontor handeln. Die Handelsrichtung könnt Ihr mittels der Buttons im Selektionsfenster wählen.
WindowCode10=
WindowMp3_10=musik\tutorial\3_4.mp3
WindowText11=\\f1_Das Menü erscheint nur, wenn Ihr ein Kontor in der Stadt habt und außerdem ein Schiff selektiert ist, denn nur dann habt Ihr verschiedene Handelsmöglichkeiten.
WindowCode11=
WindowMp3_11=musik\tutorial\3_5.mp3
WindowText12=\\f1_Wählt nun den Handel zwischen Stadt und Schiff. Ihr seht links die Waren, die die Stadt hat und rechts die Waren, die auf dem Schiff sind. Da wir gerade erst anfangen, sind da keine.
WindowCode12=
WindowMp3_12=musik\tutorial\3_6.mp3
WindowText13=\\f1_Zwischen Stadt und Schiff befinden sich die Kaufen- und Verkaufen-Buttons. Auf jedem Button steht bereits ein Preis. Kaufen heißt, Ihr kauft. Verkaufen heißt, Ihr verkauft.
WindowCode13=
WindowMp3_13=musik\tutorial\3_7.mp3
WindowText14=\\f1_Wie Ihr seht, bezahlt Euch die Stadt weniger als Ihr beim Kaufen einer Ware bezahlen müßt. Dies ist sozusagen die Gewinnspanne der Stadt. Wenn Ihr also eine Ware kauft und sofort wieder verkauft, so macht Ihr Verlust. Ihr müßt die Ware dort verkaufen, wo sie teurer ist.
WindowCode14=
WindowMp3_14=musik\tutorial\3_8.mp3
WindowText15=\\f1_Kauft nun soviel Fisch, wie auf Euer Schiff paßt. Klickt dazu in der Spalte kaufen mehrmals auf den entsprechenden Button. Insgesamt passen 15 Last Fisch auf Eurer Schiff.
WindowCode15=
WindowMp3_15=musik\tutorial\3_9.mp3
WindowText16=\\f1_Habt Ihr bemerkt, wie der Preis beim Kaufen der Ware anstieg? Dies liegt daran, daß durch Euer Kaufen das Angebot in der Stadt gesunken ist. Merkt Euch: je kleiner das Angebot, desto höher der Preis. Entsprechend fällt der Preis beim Verkaufen der Ware.
WindowCode16=
WindowMp3_16=musik\tutorial\3_10.mp3
WindowText17=\\f1_Aber der Preis hängt nicht nur vom Angebot ab, sondern auch von der Nachfrage der Bürger und Betriebe in der Stadt, denn sie müssen von den Waren leben, die in der Stadt vorhanden sind. Merkt Euch: je größer die Nachfrage, desto höher ist der Preis.
WindowCode17=
WindowMp3_17=musik\tutorial\3_11.mp3
WindowText18=\\f1_Rechts neben dem gerade gekauften Fisch steht eine Zahl. Dies ist der Durchschnittspreis, den Ihr pro Wareneinheit bezahlt habt. Ihr müßt nun eine Stadt finden, die Euch mehr als diesen Preis bezahlt. Nur dann macht Ihr Gewinn.
WindowCode18=
WindowMp3_18=musik\tutorial\3_12.mp3
WindowText19=\\f1_Übrigens werden nicht alle Waren in Last gemessen. Die selteneren Waren werden in Faß gemessen, wobei eine Last soviel Platz wie 10 Fässer einnimmt. Neben dem Schiffsnamen seht Ihr, daß die 15 Last Fisch 150 Faß, also den gesamten Laderaum einnehmen.
WindowCode19=
WindowMp3_19=musik\tutorial\3_13.mp3
WindowText20=\\f1_Fisch ist in Lübeck in großen Mengen vorhanden und daher auch günstig, da es hier produziert wird. Wir wollen uns nun anschauen, welche Waren noch in Lübeck produziert werden. Schließt nun das Handelsfenster mit einem Rechtsklick der Maus.
WindowCode20=
WindowMp3_20=musik\tutorial\3_14.mp3
WindowText21=\\f1_Nicht weit vom Hafen steht ein Gebäude, das auf Säulen steht. Hinter den Säulen befindet sich die Markthalle. Klickt nun auf dieses Gebäude, es birgt einige sehr interessante Informationen.
WindowCode21=
WindowMp3_21=musik\tutorial\3_15.mp3
WindowText22=\\f1_Hier könnt Ihr auch ansehen, welche Waren in der Stadt produziert werden. Klickt dazu auf den Button "Produktion". Da noch keine Händler in dieser Stadt einen Betrieb eröffnet haben, wird nur die Produktion der stadteigenen Betriebe angezeigt.
WindowCode22=
WindowMp3_22=musik\tutorial\3_16.mp3
WindowText23=\\f1_Über den Button "Verbrauch" könnt Ihr Euch anzeigen lassen, welche und wie viele Waren in der Stadt von Bürgern und Betrieben pro Woche verbraucht werden. Anhand der Mengen könnt Ihr abschätzen, wie lange die verfügbaren Waren noch halten.
WindowCode23=
WindowMp3_23=musik\tutorial\3_17.mp3
WindowText24=\\f1_Nun wollen wir in eine Stadt reisen, die keinen Fisch produziert. London ist eine solche Stadt. Schließt die Markthalle, selektiert Euer Schiff und gebt London als Reiseziel an. Mit Hilfe des Schnellvorlaufs seid Ihr bald da.
WindowCode24=
WindowMp3_24=musik\tutorial\3_18.mp3
WindowText25=\\f1_Nun begebt Euch auf die Seekarte und klickt auf London, um die Stadt zu betreten. Klickt auf den Hafenkran, aber bedenkt, daß Euer Schiff selektiert sein muß. Verkauft nun soviel Fisch, bis der Preis, den man Euch bezahlt, unter dem Durchschnittspreis liegt, den Ihr selbst bezahlt habt.
WindowCode25=
WindowMp3_25=musik\tutorial\3_19.mp3
WindowText26=\\f1_Konntet Ihr nicht alle Waren verkaufen, so könnt Ihr es noch in anderen Städten versuchen. Doch bevor Ihr weiterfahrt, solltet Ihr versuchen, eine günstige Ware mitzunehmen. Doch wie erkennt man, ob eine Ware günstig ist?
WindowCode26=
WindowMp3_26=musik\tutorial\3_20.mp3
WindowText27=\\f1_Zum einen könnt Ihr in der Markthalle nachsehen, wie groß der Verbrauch und der Bestand einer Ware ist. Je länger eine Ware hält, desto niedriger ist ihr Preis.
WindowCode27=
WindowMp3_27=musik\tutorial\3_21.mp3
WindowText28=\\f1_Aber auch im Handelsfenster gibt es Informationen: betrachtet einmal die Preisunterschiede zwischen Ankauf- und Verkaufpreis. Je größer die Unterschiede sind, desto größer ist der Bedarf der Stadt.
WindowCode28=
WindowMp3_28=musik\tutorial\3_22.mp3
WindowText29=\\f1_Ein Unterschied von ca. 10% ist noch in Ordnung, jedoch solltet Ihr niemals Waren kaufen, die im Kauf fast doppelt so teuer sind wie im Verkauf. Eine solche Ware ist in der Stadt knapp und Ihr würdet es schwer haben, diese Ware mit Gewinn wieder zu verkaufen.
WindowCode29=
WindowMp3_29=musik\tutorial\3_23.mp3
WindowText30=\\f1_Betrachtet nun einmal die Buttons unten im Handelsfenster. Hier könnt Ihr die Stückzahl einstellen, die Ihr handeln möchtet. Ob Ihr aber 5 Waren auf einmal kauft oder 5 mal eine Ware, ist letztlich egal. Ihr bezahlt genau den gleichen Gesamtpreis. 
WindowCode30=
WindowMp3_30=musik\tutorial\3_24.mp3
WindowText31=\\f1_Die Stückelung dient lediglich dazu, Euch das Handeln mit großen Mengen zu erleichtern. Der Max-Button berücksichtigt beim Kaufen, wie viele Waren auf dem Schiff noch Platz haben. Beim Verkaufen berücksichtigt er, wie viele Waren auf dem Schiff vorhanden sind. Dadurch könnt Ihr alles auf einmal verkaufen.
WindowCode31=
WindowMp3_31=musik\tutorial\3_25.mp3
WindowText32=\\f1_Die Grundzüge des Handels sind nun erklärt. Am Besten lernt Ihr es, wenn Ihr in Ruhe selbst ein paar Versuche macht.
WindowCode32=
WindowMp3_32=musik\tutorial\3_26.mp3
WindowText33=\\f1_Bevor wir dieses Kapitel beenden, möchte ich Euch noch ein paar Hinweise zur Bevölkerungsstruktur in einer Stadt geben. Ihr habt bereits gelernt, daß es in einer Stadt Arme, Wohlhabende und Reiche gibt. Jede Gruppe hat bestimmte Waren, die sie besonders benötigt.
WindowCode33=
WindowMp3_33=musik\tutorial\3_27.mp3
WindowText34=\\f1_Während die armen Bürger vor allem Grundnahrungsmittel wie Getreide, Fisch und Bier benötigen, stehen für die Reichen kostspieligere Waren wie Fleisch, Wein und Tuch an erster Stelle. Die Wohlhabenden stehen in Ihren Wünschen zwischen den Armen und Reichen. 
WindowCode34=
WindowMp3_34=musik\tutorial\3_28.mp3
WindowText35=\\f1_Je nachdem, welche Gruppe Ihr primär versorgt, steigt Eure soziale oder Eure gesellschaftliche Anerkennung.\nDoch denkt daran: Eure Beliebtheit steigt nicht nur mit dem Verkauf von Waren. Alles, was Ihr zum Wohle der Hanse und Ihrer Bürger unternehmt, bringt Euch weiter nach oben.
WindowCode35=
WindowMp3_35=musik\tutorial\3_29.mp3
WindowText36=\\f1_Klickt auf den "Weiter"-Button, um dieses Kapitel zu beenden.
WindowCode36=
WindowMp3_36=musik\tutorial\3_30.mp3

[GameTutorialBase3]
SaveGame=tut3
WindowCnt=34
WindowText0=\\f1_Im vierten Kapitel dieses Tutorials beschäftigen wir uns mit dem Aufbau von Städten. Ihr werdet erfahren, aus welchen Gebäuden Städte bestehen und welche Gebäude Ihr selbst bauen könnt, um den Aufbau einer Stadt voranzutreiben.
WindowCode0=
WindowMp3_0=musik\tutorial\4_1.mp3
WindowText1=\\f1_Jede Stadt besteht aus Aktionsgebäuden, Wohnhäusern und Betrieben. Aktionsgebäude sind Gebäude, in denen Ihr bestimmte Dinge erledigen könnt. Die Kneipe und die Werft habt Ihr ja schon kennengelernt. Weitere Gebäude sind Rathaus und Kirche. Eine Hansestadt wie Lübeck hat insgesamt 12 solcher Gebäude.
WindowCode1=
WindowMp3_1=musik\tutorial\4_2.mp3
WindowText2=\\f1_Euer wichtigstes Gebäude ist zunächst Euer Kontor. In Lübeck befindet es sich links und nahe am Wasser. Das Kontor ist in Eurer Heimatstadt Wohnraum, Büro und Lager und stellt in anderen Städten eine Niederlassung Eures Handelsunternehmens dar.
WindowCode2=
WindowMp3_2=musik\tutorial\4_3.mp3
WindowText3=\\f1_Wir wollen die Gebäude jedoch im Rahmen des Tutorials nicht alle im einzelnen durchsprechen.\nMerkt Euch aber, daß Ihr jedes Gebäude in Patrizier 2 anklicken könnt und daß die Aktionsgebäude immer in Hafen- bzw. Marktplatznähe stehen.
WindowCode3=
WindowMp3_3=musik\tutorial\4_4.mp3
WindowText4=\\f1_Außer den Aktionsgebäuden gibt es in jeder Stadt noch die Betriebe und Wohnhäuser. In den Betrieben werden Rohstoffe und Waren produziert, in den Wohnhäusern wohnen die Arbeiter und Handwerker sowie deren Familien.
WindowCode4=
WindowMp3_4=musik\tutorial\4_5.mp3
WindowText5=\\f1_Ihr könnt überall dort Betriebe und Wohnhäuser bauen, wo Ihr ein Kontor gebaut habt.
WindowCode5=
WindowMp3_5=musik\tutorial\4_6.mp3
WindowText6=\\f1_Ein weiterer Vorteil des Kontors ist übrigens, daß Ihr die Stadt auch dann betreten könnt, wenn kein eigenes Schiff im Hafen liegt.\nWie bereits erwähnt, sind solche Städte dann auf der Seekarte mit einem blauen Punkt markiert.
WindowCode6=
WindowMp3_6=musik\tutorial\4_8.mp3
WindowText7=\\f1_Betrachten wir nun die Betriebe in Lübeck. Da jede Stadt andere geographische Voraussetzungen hat und auch historisch gesehen die Berufsgruppen in den verschiedenen Städten unterschiedlich vertreten waren, könnt Ihr in jeder Stadt nur bestimmte Betriebe bauen.
WindowCode7=
WindowMp3_7=musik\tutorial\4_9.mp3
WindowText8=\\f1_Öffnet nun das Baumenü. Es ist der 4. Button in der Buttonleiste. Im Baumenü gibt es den Kontorbau, städtische Bauten, Rohstoff- und veredelnde Betriebe sowie Befestigungsmaßnahmen. Klickt einmal auf jeden Bereich, um zu sehen, was sich dahinter verbirgt.
WindowCode8=Rect 1,268,259,30
WindowMp3_8=musik\tutorial\4_10.mp3
WindowText9=\\f1_"Befestigung" könnt Ihr nicht anwählen, da Ihr zur Befestigung erst Zugang habt, wenn Ihr der Bürgermeister einer Stadt seid.\nWählt nun den Bereich "Veredelnde Betriebe" und dann "Werkstatt".
WindowCode9=
WindowMp3_9=musik\tutorial\4_11.mp3
WindowText10=\\f1_Im Selektionsfenster seht Ihr nun die Baukosten, die Bauzeit und die benötigten Baumaterialien. Diese Materialen werden aus Eurem Kontor entnommen, sofern sie dort vorhanden sind. Ist dies nicht der Fall, so werden sie direkt bei der Stadt gekauft und die jeweiligen Kaufpreise werden angezeigt.
WindowCode10=Rect 1,341,260,256
WindowMp3_10=musik\tutorial\4_12.mp3
WindowText11=\\f1_Es kann auch sein, daß ein Baumaterial weder in der Stadt noch in Eurem Kontor vorhanden ist. In diesem Fall könnt Ihr das Gebäude nicht bauen und müßt erst in anderen Städten die benötigten Rohstoffe einkaufen.
WindowCode11=Rect 1,341,260,256
WindowMp3_11=musik\tutorial\4_13.mp3
WindowText12=\\f1_Für die Werkstatt ist das aber nicht der Fall. Da genug Rohstoffe vorhanden sind, werden in der Stadtansicht und auf der Minikarte alle Bauplätze markiert, die das Bauamt der Stadt Euch zuweist. 
WindowCode12=
WindowMp3_12=musik\tutorial\4_14.mp3
WindowText13=\\f1_Bewegt nun den Mauszeiger auf einen dieser Bauplätze. Verwendet dazu auch die Pfeiltasten auf der Tastatur, um einen Bauplatz in den sichtbaren Bereich zu bekommen. Wenn Ihr nun mit dem Mauszeiger über einen Bauplatz kommt, so leuchtet am Mauszeiger die Werkstatt auf. Macht nun einen Linksklick.
WindowCode13=
WindowMp3_13=musik\tutorial\4_15.mp3
WindowText14=\\f1_Es erscheint eine Baustelle und Rohstoffe sowie Geld werden abgezogen. Wählt nun "Zurück" im Selektionsfenster, um das Bauen zu beenden. Wenn Ihr eine Weile auf die Baustelle schaut, könnt Ihr auch sehen, wie das Gebäude langsam aufgebaut wird. 
WindowCode14=
WindowMp3_14=musik\tutorial\4_16.mp3
WindowText15=\\f1_Betätigt nun den Zeitvorlauf so lange, bis die Werkstatt fertig gebaut ist. Nun klickt das fertige Gebäude an. Zunächst wird Euch angezeigt, wie viele Werkstätten Ihr in Lübeck besitzt. Neben dem Arbeitersymbol könnt Ihr sehen, wie viele Arbeiter derzeit vorhanden sind und maximal benötigt werden.
WindowCode15=Rect 1,341,260,256
WindowMp3_15=musik\tutorial\4_17.mp3
WindowText16=\\f1_Dabei werden alle Betriebe des gleichen Typs zusammengefaßt. Ihr könnt hier auch angeben, welche Auslastung die Betriebe haben sollen.
WindowCode16=Rect 1,341,260,256
WindowMp3_16=musik\tutorial\4_18.mp3
WindowText17=\\f1_Darunter seht Ihr, welche Rohstoffe der Betrieb benötigt und welche Waren er produziert. Im Falle der Werkstatt werden Eisenerz und Holz gebraucht, Eisenwaren werden produziert. Damit dieser Betrieb produzieren kann, müssen sich die Rohstoffe in Eurem Kontor befinden, was im Moment auch der Fall ist.
WindowCode17=Rect 1,341,260,256
WindowMp3_17=musik\tutorial\4_19.mp3
WindowText18=\\f1_Betrachtet nun einmal die Gesamtkosten: das sind die wöchentlichen Kosten aller Betriebe dieses Typs. Sie setzen sich aus Grundsteuer, Instandhaltung und Lohnkosten zusammen. Um die Produktionskosten, d.h. die Kosten pro Ware, niedrig zu halten, müßt Ihr immer versuchen, die Betriebe voll auszulasten. 
WindowCode18=Rect 1,341,260,256
WindowMp3_18=musik\tutorial\4_20.mp3
WindowText19=\\f1_Beachtet auch, daß die Produktion einer bestimmten Ware nicht in allen Städten gleich hoch ist. Waren können in den Städten entweder besonders gut, weniger gut oder gar nicht produziert werden. In Städten mit niedriger Produktion sind entsprechend die Produktionskosten höher. Beachtet dazu die beigelegte Karte.
WindowCode19=Rect 1,341,260,256
WindowMp3_19=musik\tutorial\4_21.mp3
WindowText20=\\f1_Übrigens könnt Ihr euch auch über Betriebe informieren, die Ihr nicht selbst gebaut habt. In der Minikarte könnt Ihr sehen, welche Gebäude von Euch sind und welche von anderen. Eigene Gebäude sind blau gefärbt, die von anderen Händlern weiß, die der Stadt grau.
WindowCode20=Rect 5,49,250,213
WindowMp3_20=musik\tutorial\4_22.mp3
WindowText21=\\f1_Ihr könnt auch auf das Haussymbol in der Titelleiste klicken. Daraufhin werden die Betriebe und Wohnhäuser, die von anderen gebaut wurden, transparent. Dies ist sehr nützlich, denn es zeigt Euch, wie präsent Eure Konkurrenten im Vergleich zu Euch in der Stadt sind.  
WindowCode21=Rect 1,0,2000,31
WindowMp3_21=musik\tutorial\4_23.mp3
WindowText22=\\f1_Nun wollen wir ein Wohnhaus bauen. Dazu müßt Ihr wissen, daß pro Arbeiter in der Stadt im Durchschnitt vier Bürger in einem Wohnhaus Platz haben müssen, denn der Arbeiter hat auch eine Familie. Ist nicht genug Wohnraum vorhanden, so kann sich die Zahl der Arbeiter in der Stadt nicht erhöhen.
WindowCode22=
WindowMp3_22=musik\tutorial\4_24.mp3
WindowText23=\\f1_Ihr könnt erfahren, wie hoch die prozentuale Auslastung der vorhandenen Wohnhäuser ist, indem Ihr ein Wohnhaus anklickt.\nJedes Wohnhaus hat 3 Stufen, von denen Ihr nur die erste bauen könnt. Die höheren Stufen werden erreicht, sobald mehr und mehr Bürger in das Haus einziehen. 
WindowCode23=
WindowMp3_23=musik\tutorial\4_25.mp3
WindowText24=\\f1_Haben alle Wohnhäuser die dritte Stufe erreicht, so ist dies ein Zeichen dafür, daß der Wohnraum in der Stadt knapp wird.\nBaut nun ein Wohnhaus. Wählt dazu im Baumenü "Städtische Gebäude" und wählt das Fachwerkhaus für die armen Bürger der Stadt
WindowCode24=
WindowMp3_24=musik\tutorial\4_25_1.mp3
WindowText25=\\f1_Setzt nun dieses Gebäude wie vorhin die Werkstatt. Nachdem es fertig gebaut wurde, könnt Ihr beobachten, wie es sich langsam füllt. Damit es sich füllt, muß es Arbeit in der Stadt geben. Dann nämlich können Bettler zu Arbeitern werden und in die Gruppe der armen Bürger aufsteigen.
WindowCode25=
WindowMp3_25=musik\tutorial\4_26.mp3
WindowText26=\\f1_Dazu muß aber die Lebensqualität der Armen ausreichend hoch sein. Sind die armen Bürger unzufrieden, da beispielsweise nicht genug Waren vorhanden sind, so kommen auch keine Bettler in die Stadt - und Ihr könnt keine neuen Arbeiter einstellen.
WindowCode26=
WindowMp3_26=musik\tutorial\4_27.mp3
WindowText27=\\f1_Die Bevölkerung in einer Stadt besteht aus Bettlern, Armen, Wohlhabenden und Reichen. Jede Gruppe hat eigene Bedürfnisse und verbraucht bestimmte Waren. So ist den Armen beispielsweise Getreide sehr wichtig, während den Reichen Fleisch und Wein wichtiger ist.
WindowCode27=
WindowMp3_27=musik\tutorial\4_28.mp3
WindowText28=\\f1_Klickt nun einmal auf das Einwohnersymbol in der Titelleiste. In einem Fenster werden Euch dann die Größen der verschiedenen Bevölkerungsgruppen angezeigt. Beachtet, daß es immer weniger Reiche als Wohlhabende und weniger Wohlhabende als Arme in einer Stadt gibt.
WindowCode28=Rect 1,0,2000,31
WindowMp3_28=musik\tutorial\4_29.mp3
WindowText29=\\f1_Ihr könnt in diesem Fenster ebenfalls sehen, wie zufrieden eine Gruppe ist. Eine unzufriedene oder verärgerte Bürgergruppe kann nicht wachsen, im Gegenteil, sie schrumpft sogar. Damit die Bürger einer Stadt zufrieden sind, müssen wenigstens die wichtigsten Waren in der Stadt vorhanden sein. 
WindowCode29=
WindowMp3_29=musik\tutorial\4_30.mp3
WindowText30=\\f1_Ist übrigens eine Gruppe einmal verärgert, so dauert es auch seine Zeit, bis sich die gute Laune wieder einstellt, Ihr müßt also Geduld haben. An den Pfeilen rechts neben der Zufriedenheit kann man erkennen, ob sich der Zustand einer Gruppe gerade verbessert oder verschlechtert.
WindowCode30=
WindowMp3_30=musik\tutorial\4_31.mp3
WindowText31=\\f1_Aber Ihr seid ja zum Glück nicht der einzige Händler, der Waren transportiert und ausliefert. Doch könnt Ihr großen Einfluß darauf haben, ob eine Stadt wirklich zu beachtlicher Größe anwächst.
WindowCode31=
WindowMp3_31=musik\tutorial\4_32.mp3
WindowText32=\\f1_Außer dem Warenangebot gibt es jedoch noch andere Einflußfaktoren auf die Zufriedenheit. Brunnen, Spitäler, ausgebaute Straßen und der Verteidigungszustand können ebenfalls die Lebensqualität in der Stadt verbessern.
WindowCode32=
WindowMp3_32=musik\tutorial\4_33.mp3
WindowText33=\\f1_Klickt nun auf den "Weiter"-Button, um dieses Kapitel zu beenden.
WindowCode33=
WindowMp3_33=musik\tutorial\4_34.mp3

[GameTutorialBase4]
SaveGame=tut4
WindowCnt=17
WindowText0=\\f1_Willkommen im Tutorial über Seeschlachten.\nWährend Eurer langen Reisen durch den Seeraum der Hanse kann es Euch leider immer wieder passieren, daß Ihr von einem Piraten angegriffen werdet, der es auf Euer Schiff und Eure Ladung abgesehen hat.
WindowCode0=
WindowMp3_0=musik\tutorial\5_1.mp3
WindowText1=\\f1_Trefft Ihr auf der Seekarte auf einen Piraten, so werdet Ihr darüber informiert und außerdem gefragt, ob Ihr die Seeschlacht automatisch durchführen wollt oder ob Ihr lieber manuell steuert. Wählt Ihr dann manuell, so kommt Ihr zu der hier angezeigten Seeschlachtansicht, in der sich die Schiffe gegenüber stehen.
WindowCode1=
WindowMp3_1=musik\tutorial\5_2.mp3
WindowText2=\\f1_In diesem Training habt Ihr allerdings von Eurem Gegner nichts zu befürchten, den es handelt sich nur um 3 leere Schiffe. Wohl aber könnt Ihr üben, wie man ein Schiff während einer Seeschlacht steuern kann. Selektiert zunächst Euer Schiff "Adler der See" und betrachtet seine Daten.
WindowCode2=
WindowMp3_2=musik\tutorial\5_3.mp3
WindowText3=\\f1_Wie Ihr seht, wird automatisch das Deck des Schiffes angezeigt. Das Schiff ist eine Schnigge, die in der Werft zweimal ausgebaut wurde. Dadurch hat sie Warenkapazität eingebüßt, jedoch auch die Möglichkeit bekommen, Waffen aufzustellen, was Ihr an den 8 kleinen Bliden sehen könnt.
WindowCode3=
WindowMp3_3=musik\tutorial\5_4.mp3
WindowText4=\\f1_Durch das Aufrüsten gewinnt ein Schiff übrigens auch an Stabilität.\nBetrachten wir einmal die Funktionen und Anzeigen des Schiffdecks. Zunächst werden wieder Geschwindigkeit, Zustand, Besatzung und Waffenstärke angezeigt. Daneben seht Ihr zwei Buttons: Entern und Feuern.
WindowCode4=
WindowMp3_4=musik\tutorial\5_5.mp3
WindowText5=\\f1_Mit "Feuern" schießt Euer Schiff automatisch in Richtung des Gegners. Klickt einmal auf diesen Button. Ihr seht dann, wie eine Salve Euer Schiff verläßt und im Wasser landet. Außerdem seht Ihr, daß es eine Weile dauert, bis die Schiffswaffen wieder nach geladen sind.
WindowCode5=
WindowMp3_5=musik\tutorial\5_6.mp3
WindowText6=\\f1_Statt auf "Feuern" zu klicken, könnt Ihr auch auf der Tastatur die Leertaste oder die Zahl 0 auf dem Nummerblock drücken.\nMit Hilfe des "Entern"-Buttons gebt Ihr Eurem Schiff das Signal, das feindliche Schiff nach Möglichkeit zu entern. Das Entern wird dabei eingeleitet, sobald die Schiffe dicht nebeneinander stehen.
WindowCode6=
WindowMp3_6=musik\tutorial\5_7.mp3
WindowText7=\\f1_Natürlich solltet Ihr ein Schiff nur dann entern, wenn Eure Besatzung zahlenmäßig überlegen ist.\nBeachtet bitte, daß die Schiffsdeck-Funktionen nur während Seeschlachten zur Verfügung stehen.
WindowCode7=
WindowMp3_7=musik\tutorial\5_8.mp3
WindowText8=\\f1_Nun wollen wir Euer Schiff in Bewegung setzen. Zunächst müßt Ihr dazu die Segel setzen. Dies macht Ihr durch einen Klick auf das Seil. Ihr könnt die Segelstufen auch mit den Tasten "Bild hoch" und "Bild runter" auf der Tastatur verändern. 
WindowCode8=
WindowMp3_8=musik\tutorial\5_9.mp3
WindowText9=\\f1_Die Richtung des Schiffes verändert Ihr, indem Ihr auf eine Stelle im Wasser rechtsklickt. Ihr könnt auch die rechte Maustaste gedrückt halten und dabei die Maus bewegen. Anhand des Pfeils auf dem Wasser könnt Ihr sehen, in welche Richtung das Schiff nun fährt.
WindowCode9=
WindowMp3_9=musik\tutorial\5_10.mp3
WindowText10=\\f1_Habt Ihr schon die vorüberziehenden Wolken gesehen? Sie zeigen Euch Windrichtung und Windstärke an. Vermeidet es immer, direkt gegen den Wind zu fahren.\nNun nehmt Kurs auf eines der Schiffe. Falls der Button "Entern" aktiviert ist, so deaktiviert ihn bitte.
WindowCode10=
WindowMp3_10=musik\tutorial\5_11.mp3
WindowText11=\\f1_Sobald sich der Gegner seitlich von Eurem Schiff befindet, solltet Ihr eine Breitseite abfeuern. Kreuzt nun um das Schiff hin und her und versucht, es mit Breitseiten zu versenken. Versucht dabei, beim Wenden den Schwung auszunutzen und vermeidet es, gegen den Wind zu segeln.
WindowCode11=
WindowMp3_11=musik\tutorial\5_12.mp3
WindowText12=\\f1_Nun wollen wir den Gegner auf andere Weise angreifen. Ist Euer Schiff ausgewählt, so macht einfach einen Rechtsklick auf einen Gegner. Euer Schiff greift nun automatisch an und versenkt den Gegner. Beachtet, daß das Entern nicht aktiviert ist, denn sonst würde Euer Schiff den Gegner entern.
WindowCode12=
WindowMp3_12=musik\tutorial\5_13.mp3
WindowText13=\\f1_Diese automatische Steuerung ist sehr praktisch, wenn Ihr Euch mit mehreren Schiffen in einer Seeschlacht befindet.\nBevor wir uns mit dem dritten Schiff beschäftigen, solltet Ihr noch etwas üben. Denn sobald das letzte Schiff besiegt wurde, ist die Seeschlacht vorbei und die Ansicht wechselt wieder zur Seekarte.
WindowCode13=
WindowMp3_13=musik\tutorial\5_14.mp3
WindowText14=\\f1_Das dritte Schiff wollen wir nun entern. Aktiviert das Entern und macht einen Rechtsklick auf den Gegner oder nähert Euch dem Gegner manuell. Sobald die Schiffe nah beieinander sind, wird der Enterkampf eingeleitet. Da der Gegner keine Besatzung hat, ist die Situation schnell entschieden.
WindowCode14=
WindowMp3_14=musik\tutorial\5_15.mp3
WindowText15=\\f1_Nach einer Seeschlacht wird noch eine Zusammenfassung angezeigt. Dann gelangt Ihr zurück auf die Seekarte.
WindowCode15=
WindowMp3_15=musik\tutorial\5_16.mp3
WindowText16=\\f1_Das letzte Tutorial-Kapitel ist nun beendet. Wählt "Spiel beenden" im Optionsmenü, um zum Hauptmenü zurück zu kehren.
WindowCode16=
WindowMp3_16=musik\tutorial\5_17.mp3
