QuestCount=5

QuestName_0=Bedienung der Spieloberfläche
QuestText_0=In diesem ersten Abschnitt des Tutorials lernt Ihr die grundlegende Bedienung der Spieloberfläche kennen.
QuestTexture_0=41000

QuestName_1=Schiffe
QuestText_1=Schiffe sind das Grundkapital eines jeden Fernkaufmanns. Das Reisen wird ebenso erklärt wie das Anheuern von Matrosen und Kapitänen. Auch das Bauen und das Reparieren von Schiffen wird beschrieben.
QuestTexture_1=41001

QuestName_2=Der Handel
QuestText_2=In diesem wohl wichtigsten Abschnitt überhaupt wird Euch alles Wissenswerte über den Handel erklärt. Dazu gehört das Einkaufen, Verkaufen und Transportieren von Waren, ebenso das System von Angebot, Nachfrage, Bedarf und Verbrauch. Dieses Wissen wird Euch zu einem erfolgreichen Händler machen können.
QuestTexture_2=41002

QuestName_3=Aufbau von Städten
QuestText_3=Ein Stadt unterteilt sich im Wesentlichen in städtische Gebäude, Wohnhäuser und Betriebe. Bereits als einfacher Händler könnt Ihr Wohnhäuser bauen, um Wohnraum für neue Bürger zur Verfügung zu stellen. Mit dem Bau von Betrieben könnt Ihr nicht nur Arbeitsuchende aus dem Hinterland in die Stadt holen, sondern auch selbst Rohstoffe und Waren produzieren.
QuestTexture_3=41003

QuestName_4=Seeschlachten
QuestText_4=In diesem letzten Abschnitt des Tutorials lernt Ihr das Aufrüsten von Schiffen und das Einkaufen von Schiffswaffen. In einer Einführungsschlacht lernt Ihr das Manövrieren von Schiffen während einer Seeschlacht sowie das Entern von gegnerischen Schiffen. Ihr wollt selbst als Pirat agieren? Auch das wird erklärt.
QuestTexture_4=41004


[Campaign_1]
Name=Kampagne: Der Aufstieg
Text=Diese Kampagne ist als Einstiegskampagne gedacht. Ihr beginnt als einfacher Krämer in Lübeck und müßt innerhalb von 4 Jahren in Lübeck zum Patrizier aufsteigen. Während der Kampagne erhaltet Ihr in Form von persönlichen Nachrichten Tipps und Hinweise, wie Ihr Euer Ziel am Besten erreichen könnt.
Texture=41100
QuestCount=0


[Campaign_2]
Name=Kampagne: Der fliegende Händler
Text=Ihr seid ein junger Krämer aus reichem Lübecker Elternhaus. Eure Privatlehrer haben Euch eine umfassende Bildung zuteil werden lassen, die schon dem aufklärerischen Geist der Renaissance vorweg greift. Die Welt, in die Ihr Euch begebt, ist geprägt von tiefer Religiosität und seemännischem Aberglauben an den Klabautermann. Werdet Ihr es in dieser Welt zu einem tüchtigen Händler bringen, wie es Euer Vater vor Euch war?
texture=41100
QuestCount=0

[Campaign_3]
Name=Kampagne: Aufschwung der Hanse
Text=Die Hanse befindet sich in einem katastrophalen Zustand: Durch Korruption und Piraterie sind viele Städte ruiniert worden.\nIhr ward viele Jahre auf einer langen Reise im Süden, auf der Suche nach neuen Ländern und Geschäftspartnern. Doch als Ihr zurückkehrt, liegt Euer Unternehmen in Trümmern. Eure einst durch Eure Hilfe florierende Heimatstadt Rostock scheint wie zurückgeworfen zu den Anfängen.\nDoch Eure Freunde im Rat haben Euch noch nicht vergessen. Durch Eure Tüchtigkeit und Ehrlichkeit ward Ihr stets ein angesehenes Mitglied und Euch wurde höchstes Vertrauen zuteil. Daher wählt man Euch aus, die Hanse wieder Aufzubauen. Ihr werdet Unterstützung bekommen, wo es nur geht. Doch hofft nicht auf zu viel Hilfe.\nEure Aufgabe wird es zunächst sein, Euer Unternehmen in Rostock auf Vordermann zu bringen. Danach müßt Ihr Euch auch um die anderen Städte kümmern. Euer Ziel muß es sein, die Einwohnerzahl der Hanse binnen 15 Monaten zu verdoppeln.\nKeine leichte Aufgabe, aber Ihr könnt es schaffen.
texture=41100
QuestCount=0

[Campaign_4]
Name=Szenario: Die Sanierung
Text=Wie konnte das passieren? Ihr seid gerade von einer Bildungsreise im Mittelmeerraum zurückgekehrt und bedauert nun sehr, daß Ihr Eurem Cousin das Unternehmen anvertraut habt. Durch seine Einmischung in die Geschäfte hat er es in wenigen Monaten beinahe geschafft, den Ruin herbeizuführen. Eure Buchhalter verzweifeln, Eure Arbeiter und Matrosen bangen, die Bürger fürchten eine Wirtschaftskrise.\nFür Euch bedeutet das: Gewand hochkrempeln und an die Arbeit. In 3 Monaten müßt Ihr wieder das gleiche Vermögen haben, wie vor Eurer Abreise. Und das lag immerhin bei 3 Millionen!
texture=41101
QuestCount=0

[Campaign_5]
Name=Szenario: Die Mißernte
Text=Durch einen sehr späten Frühling und einen relativ kalten Sommer fällt die Weizenernte im gesamten Hanseraum äußerst mager aus. Bereits im Herbst sind die Weizenvorräte fast aufgebraucht. Eine schwere Hungersnot droht, die viele Bürger zum Verlassen der Städte treiben könnte.\nDoch glücklicherweise habt Ihr Euch der Fisch- und Fleischproduktion verschrieben. Ihr beginnt Eure Mission im November 1357 und habt Fischerhütten in Eurer Heimatstadt Lübeck und Viehhöfe in Aalborg. Außerdem verfügt Ihr über einige Vorräte an Nahrungsmitteln. Eure Weizen- und Biervorräte solltet Ihr allerdings sehr weise einsetzen, denn Ihr könnt sie nicht nachproduzieren.\nIhr gewinnt diese Mission, wenn die Hanse Ende März, nach dem Anlaufen der Getreideproduktion, um weniger als 4000 Einwohner geschrumpft ist.
texture=41101
QuestCount=0

[Campaign_6]
Name=Szenario: Das große Feuer
Text=Ihr beginnt Eure Mission in Lübeck als reicher Kaufmann, eine Woche, bevor ein großes Feuer ausbricht und viele Eurer Gebäude in Flammen aufgehen. Eure Aufgabe ist es, die Stadt nach dem Brand wieder aufzubauen. Ihr habt 6 Monate Zeit, um die Einwohnerzahl wieder auf den anfänglichen Wert zu bringen.
texture=41101
QuestCount=0

[Campaign_7]
Name=Szenario: Der Schwarze Tod
Text=Ab 1347 begann eine schwere Pestepidemie, die im Mittelmeerraum begann und sich in den 5 Folgejahren erst nach Nordwesten, später auch nach Osten ausbreitete. Vor allem in England, aber auch in allen anderen Ost- und Nordseeländern begannen Zeiten großer wirtschaftlicher Krisen, in denen auch der Seehandel empfindlich gestört wurde.\nIhr beginnt dieses Szenario als Fernkaufmann in Danzig im Jahre 1349, kurz vor dem Ausbruch der Pest in London. Ihr habt etwa einen Monat Zeit, bevor die Pest langsam auf die deutschen Städte Köln, Hamburg, Bremen, Lübeck, Rostock und Danzig übergreift. Eure Aufgabe ist es, die Städte während der Pest zu versorgen und nach Ende der Pest beim Wiederaufbau zu unterstützen. Durch rechtzeitigen Ausbau der Gesundheitsvorsorge könnt Ihr auch die Dauer und die Auswirkung der Pest in einer Stadt beeinflussen.\n4 Monate nach Beginn dieses Szenarios muß die Hanse wieder die anfängliche Einwohnerzahl haben, wenn Ihr dieses Szenario erfolgreich abschließen wollt.
texture=41101
QuestCount=0


